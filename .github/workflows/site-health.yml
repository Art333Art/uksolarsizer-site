name: Site health

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 7 * * *'

permissions:
  contents: read

concurrency:
  group: site-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate repository content
        run: python tools/validate_site.py

      - name: Check published internal and commercial links
        run: python scripts/check_site_health.py

# Refresh this scheduled workflow without creating dummy repository commits.
  # GitHub disables schedules in inactive public repositories after 60 days.
  keep-schedule-active:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Refresh scheduled workflow activation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/site-health.yml/enable"
